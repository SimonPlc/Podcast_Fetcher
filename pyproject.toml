[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Source and tests both type-checked: the recap-format review found the
# test suite had drifted out of type-clean unnoticed because only the
# package was in scope. Bare `mypy` now covers both.
files = ["podcast_fetcher", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "whisper"
ignore_missing_imports = true
